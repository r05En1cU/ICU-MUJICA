services:
  # Parser Agent: LangGraph 中枢与意图解析（对外唯一入口，宿主机端口 8001）
  parser:
    build:
      context: .
      dockerfile: docker/Dockerfile.parser
    image: icu-mujica-parser
    container_name: icu-mujica_parser
    user: "${USER_ID}:${GROUP_ID}"
    environment:
      - PYTHONPATH=/ICU-MUJICA
      - GEN_SERVICE_URL=http://gen:8000
      - VERIFY_SERVICE_URL=http://verify:8000
      - ICU_MUJICA_LLM_ENABLED=${ICU_MUJICA_LLM_ENABLED:-${AGVS4RTL_LLM_ENABLED:-false}}
      - ICU_MUJICA_LLM_BASE_URL=${ICU_MUJICA_LLM_BASE_URL:-${AGVS4RTL_LLM_BASE_URL:-}}
      - ICU_MUJICA_LLM_API_KEY=${ICU_MUJICA_LLM_API_KEY:-${AGVS4RTL_LLM_API_KEY:-}}
      - ICU_MUJICA_LLM_MODEL=${ICU_MUJICA_LLM_MODEL:-${AGVS4RTL_LLM_MODEL:-}}
      - ICU_MUJICA_LLM_PROFILE=${ICU_MUJICA_LLM_PROFILE:-${AGVS4RTL_LLM_PROFILE:-default}}
      - ICU_MUJICA_LLM_REASONING_EFFORT=${ICU_MUJICA_LLM_REASONING_EFFORT:-${AGVS4RTL_LLM_REASONING_EFFORT:-}}
      - GEN_SERVICE_TIMEOUT_SECONDS=${GEN_SERVICE_TIMEOUT_SECONDS:-420}
      - VERIFY_SERVICE_TIMEOUT_SECONDS=${VERIFY_SERVICE_TIMEOUT_SECONDS:-420}
    ports:
      - "8001:8000"
    command: python -m uvicorn src.parser.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/ICU-MUJICA/src
      - ./shared_workspace:/ICU-MUJICA/shared_workspace:rw
      - ./output:/ICU-MUJICA/output:rw
    depends_on:
      - gen
      - verify

  # Gen Agent: Architect + Coding 内部服务（仅容器内可见）
  gen:
    build:
      context: .
      dockerfile: docker/Dockerfile.gen
    image: icu-mujica-gen
    container_name: icu-mujica_gen
    user: "${USER_ID}:${GROUP_ID}"
    environment:
      - PYTHONPATH=/ICU-MUJICA
    expose:
      - "8000"
    command: python -m uvicorn src.generator.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/ICU-MUJICA/src
      - ./shared_workspace:/ICU-MUJICA/shared_workspace:rw
      - ./output:/ICU-MUJICA/output:rw

  # Verify Agent: 自动化验证内部服务（仅容器内可见）
  verify:
    build:
      context: .
      dockerfile: docker/Dockerfile.verify
    image: icu-mujica-verify
    container_name: icu-mujica_verify
    user: "${USER_ID}:${GROUP_ID}"
    environment:
      - PYTHONPATH=/ICU-MUJICA
      - VERIFY_ENABLE_IVERILOG=true
    expose:
      - "8000"
    command: python -m uvicorn src.verify.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/ICU-MUJICA/src
      - ./shared_workspace:/ICU-MUJICA/shared_workspace:rw
      - ./output:/ICU-MUJICA/output:rw